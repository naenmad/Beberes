name: Feature Request
description: Suggest an idea or new cleaning module for Beberes
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature ideas and new cleaner module suggestions from the community!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific annoyance, file bloat, or developer tool?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like Beberes to do, how it should look or function.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other tools, shell commands, or workflows you currently use for this.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, paths, or screenshots about the feature request here.
