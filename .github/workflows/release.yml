name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Git tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: macos-latest
    outputs:
      release_tag: ${{ steps.set_tag.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: set_tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=${{ github.event.inputs.tag || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Ensure GitHub Release Exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.set_tag.outputs.release_tag }}
        run: |
          echo "Preparing release for tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            NOTES="See [CHANGELOG.md](https://github.com/naenmad/Beberes/blob/main/CHANGELOG.md) for full release notes and list of changes."
            gh release create "$TAG" --title "Beberes $TAG (Apex)" --notes "$NOTES"
          fi

  build-tauri:
    name: Build DMG (${{ matrix.arch_name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch_name: 'Apple-Silicon-arm64'
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            arch_name: 'Intel-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Application
        run: |
          npx tauri build --target ${{ matrix.target }}

      - name: Find and Upload DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          echo "Scanning for DMG bundles in src-tauri/target/..."
          DMG_FILES=$(find src-tauri/target -name "*.dmg" -type f)
          if [ -z "$DMG_FILES" ]; then
            echo "Error: No DMG file found!"
            find src-tauri/target -name "bundle" -type d || true
            exit 1
          fi
          for dmg in $DMG_FILES; do
            echo "Uploading $dmg to GitHub Release $TAG..."
            gh release upload "$TAG" "$dmg" --clobber
          done

      - name: Upload DMG as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beberes-dmg-${{ matrix.arch_name }}
          path: src-tauri/target/**/bundle/dmg/*.dmg
